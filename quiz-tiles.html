  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Шаг 2 из 6 — С какой конфигурацией предстоит работать?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Структура стилей:
         1. Страница и карточка квиза
         2. Сетка опций (плитки)
         3. Адаптивность */

      /* //////////////////////////////////////////////
         1. Страница и карточка квиза
         ////////////////////////////////////////////// */
      body {
        margin: 0;
        min-height: 100vh;
        box-sizing: border-box;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f6fb;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          "Segoe UI",
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .quiz-card {
        width: 100%;
        max-width: 1296px;
        min-height: 750px;
        display: flex;
        flex-direction: column;
        background: #fff;
        border-radius: 32px;
        box-shadow: 0 24px 64px rgba(23, 58, 110, 0.08);
      }

      .quiz-card__body {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 40px 40px 32px 40px;
      }

      /* --- прогресс-бар шага квиза --- */
      .quiz-progress__label {
        margin-bottom: 10px;
        font-size: 16px;
        font-weight: 500;
        color: #8a94a6;
      }

      .progress-container {
        position: relative;
        display: flex;
        justify-content: flex-start;
        align-items: center;
        width: 100%;
      }

      .progress-container::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 10px;
        background-color: #f5f5f5;
        border-radius: 100px;
      }

      .progress-bar {
        position: relative;
        overflow: hidden;
        transform: translateZ(0);
        display: grid;
        place-items: center;
        height: 10px;
        width: 400px; /* Имитация заполнения на 4/6 шаге */
        border: 0;
        border-radius: 100px;
        transition: width 0.3s ease;
      }

      @keyframes loading {
        0% {
          transform: translateX(25px);
        }
        100% {
          transform: translateX(70px);
        }
      }

      .progress-bar::before {
        content: "";
        position: absolute;
        z-index: 1;
        top: 0;
        left: -400%;
        width: 700%;
        height: 100%;
        background: #4ade80
          repeating-linear-gradient(
            60deg,
            transparent,
            transparent 10px,
            #36d26f 10px,
            #36d26f 20px
          );

        animation: loading 2s infinite linear;
      }

      /* --- заголовок вопроса --- */
      .quiz-title {
        margin: 26px 0 40px;
        font-size: 36px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #252b37;
      }

      /* //////////////////////////////////////////////
         2. Сетка опций (плитки)
         ////////////////////////////////////////////// */
      .quiz-options-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        width: 100%;
      }

      .quiz-option {
        position: relative;
      }

      /* Скрываем стандартный радио-инпут */
      .quiz-option__input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }

      /* Основной стиль карточки-плитки */
      .quiz-option__label {
        box-sizing: border-box; /* паддинг учитывается в height */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 124px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s ease;

        /* Этот цвет унаследует SVG через currentColor */
        color: #94a3b8;
      }

      /* Контейнер для SVG-иконки.
         Иконка встроена инлайном в разметку, поэтому CSS страницы
         напрямую управляет её цветом через fill: currentColor —
         иконка наследует цвет плитки: серый по умолчанию,
         синий только в выбранном состоянии */
      .quiz-option__icon {
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 12px;
      }

      /* Цвет иконки задаётся только здесь и наследуется
         всеми path внутри SVG */
      .quiz-option__icon svg {
        width: 100%;
        height: 100%;
        fill: currentColor;
      }

      .quiz-option__text {
        font-size: 16px;
        color: #252b37;
        font-weight: 400;
        transition: color 0.2s ease;
      }

      /* Состояние при наведении (Hover).
         Иконка остаётся серой — hover меняет только рамку.
         Утолщение до 2px сделано внутренней тенью, а не
         border-width, чтобы плитка не «прыгала» на 1px */
      .quiz-option__label:hover {
        border-color: #4c9afd;
        box-shadow: inset 0 0 0 1px #4c9afd;
      }

      /* Выбранное состояние (Active) */
      .quiz-option__input:checked + .quiz-option__label {
        border-color: #4c9afd;
        box-shadow: inset 0 0 0 1px #4c9afd;
        background: #f0f6ff;
        color: #4c9afd; /* Оставляет иконку синей */
      }

      .quiz-option__input:checked + .quiz-option__label .quiz-option__text {
        color: #4c9afd;
      }

      /* Иконка галочки в правом верхнем углу (скрыта по умолчанию) */
      .quiz-option__check {
        position: absolute;
        top: -8px;
        right: -8px;
        opacity: 0;
        transform: scale(0.8);
        transition: all 0.2s ease;
        pointer-events: none;
      }

      /* Показываем галочку у выбранной плитки */
      .quiz-option__input:checked + .quiz-option__label .quiz-option__check {
        opacity: 1;
        transform: scale(1);
      }

      /* Плитка со свободным вводом текста (Другое).
         Активное состояние включается классом "is-active" из JS —
         когда в поле введён хотя бы один символ */
      .quiz-option--text-input .quiz-option__label {
        align-items: flex-start;
        justify-content: flex-start;
        cursor: text;
      }

      .quiz-option--text-input.is-active .quiz-option__label {
        border-color: #4c9afd;
        box-shadow: inset 0 0 0 1px #4c9afd;
        background: #f0f6ff;
      }

      /* Показываем галочку у активной плитки "Другое" */
      .quiz-option--text-input.is-active .quiz-option__check {
        opacity: 1;
        transform: scale(1);
      }

      .quiz-option__input-text {
        /* Поле растянуто на всю площадь плитки: клик в любом
           месте карточки ставит курсор в текстовое поле.
           resize: none убирает стандартный уголок textarea */
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        padding: 16px;
        border: none;
        outline: none;
        font-family: inherit;
        font-size: 16px;
        line-height: 1.4;
        color: #252b37;
        background: transparent;
        resize: none;
        overflow: auto;
      }

      .quiz-option__input-text::placeholder {
        color: #94a3b8;
      }

      /* --- кнопки футера --- */
      .quiz-card__footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 28px;
        border-top: 1px solid #eef1f6;
      }

      .quiz-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 13px 22px;
        border-radius: 999px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s,
          box-shadow 0.15s;
      }

      .quiz-btn--ghost {
        background: #fff;
        border: 1.5px solid #dbe4f0;
        color: #4c9afd;
      }

      .quiz-btn--ghost:hover {
        border-color: #b9d4fd;
        background: #f5f9ff;
      }

      .quiz-btn--primary {
        padding: 14px 26px;
        background: #4c9afd;
        border: none;
        color: #fff;
        box-shadow: 0 10px 22px rgba(76, 154, 253, 0.35);
      }

      .quiz-btn--primary:hover {
        background: #3a8df9;
      }

      /* //////////////////////////////////////////////
         3. Адаптивность
         ////////////////////////////////////////////// */
      @media screen and (max-width: 1024px) {
        .quiz-options-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      @media screen and (max-width: 768px) {
        .quiz-options-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media screen and (max-width: 640px) {
        body {
          padding: 12px;
        }

        .quiz-card {
          min-height: 480px;
        }

        .quiz-card__body {
          padding: 20px 20px 32px;
        }

        .quiz-title {
          font-size: 22px;
          margin: 20px 0 24px;
        }

        .quiz-options-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
