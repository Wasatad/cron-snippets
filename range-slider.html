<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Шаг 4 из 6 — Сколько специалистов нужно?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Структура стилей:
         1. Слайдер — базовые стили компонента (универсальные)
         2. Тема "overlay" — оформление слайдера для этого квиза
         3. Страница и карточка квиза
         4. Адаптивность */

      /* //////////////////////////////////////////////
         1. Слайдер — базовые стили компонента
         ////////////////////////////////////////////// */
      .range-slider {
        --primary-color: #4c9afd;

        --value-offset-y: var(--ticks-gap);
        --value-active-color: white;
        --value-background: transparent;
        --value-background-hover: var(--primary-color);
        --value-font: 700 12px/1 Arial;

        --fill-color: var(--primary-color);
        --progress-background: #eee;
        --progress-radius: 20px;
        --track-height: calc(var(--thumb-size) / 2);

        --min-max-font: 12px Arial;
        --min-max-opacity: 0.5;
        --min-max-x-offset: 10%; /* 50% — центрировать */

        --thumb-size: 22px;
        --thumb-color: white;
        --thumb-shadow:
          0 0 3px rgba(0, 0, 0, 0.4), 0 0 1px rgba(0, 0, 0, 0.5) inset,
          0 0 0 99px var(--thumb-color) inset;

        --thumb-shadow-active:
          0 0 0 calc(var(--thumb-size) / 4) inset var(--thumb-color),
          0 0 0 99px var(--primary-color) inset, 0 0 3px rgba(0, 0, 0, 0.4);

        --thumb-shadow-hover: var(--thumb-shadow);

        --ticks-thickness: 1px;
        --ticks-height: 5px;
        /* вертикальный отступ между делениями и полосой */
        --ticks-gap: var(--ticks-height, 0);
        --ticks-color: silver;

        /* ⚠️ Служебные переменные — НЕ ИЗМЕНЯТЬ:
           математика расчёта делений и шага */
        --step: 1;
        --ticks-count: Calc(var(--max) - var(--min)) / var(--step);
        --maxTicksAllowed: 30;
        --too-many-ticks: Min(
          1,
          Max(var(--ticks-count) - var(--maxTicksAllowed), 0)
        );
        /* если делений слишком много, укрупняем шаг,
           чтобы осталось всего 2 деления */
        --x-step: Max(
          var(--step),
          var(--too-many-ticks) * (var(--max) - var(--min))
        );
        --tickInterval: 100 / ((var(--max) - var(--min)) / var(--step)) *
          var(--tickEvery, 1);
        --tickIntervalPerc: calc(
          (100% - var(--thumb-size)) /
            ((var(--max) - var(--min)) / var(--x-step)) * var(--tickEvery, 1)
        );

        /* значение по умолчанию ("--value" задаётся в разметке
           одиночного слайдера) */
        --value-a: Clamp(var(--min), var(--value, 0), var(--max));
        --value-b: var(--value, 0); /* значение по умолчанию */
        --text-value-a: var(--text-value, "");

        --completed-a: calc(
          (var(--value-a) - var(--min)) / (var(--max) - var(--min)) * 100
        );
        --completed-b: calc(
          (var(--value-b) - var(--min)) / (var(--max) - var(--min)) * 100
        );
        --ca: Min(var(--completed-a), var(--completed-b));
        --cb: Max(var(--completed-a), var(--completed-b));

        /* Пояснение к сложной формуле ниже:
           "clamp" гарантирует результат либо "-1", либо "1";
           "calc" раздувает значение до огромного числа,
           чтобы избавиться от промежутка между -1 и 1
           (срабатывает, если разница заполнения бегунков > 5%);
           "+0.001" подстраховывает от нулевого результата,
           когда calc дал ровно "0" (тогда clamp тоже даст "0") */
        --thumbs-too-close: Clamp(
          -1,
          1000 * (Min(1, Max(var(--cb) - var(--ca) - 5, -1)) + 0.001),
          1
        );
        --thumb-close-to-min: Min(1, Max(var(--ca) - 2, 0)); /* порог 2% */
        --thumb-close-to-max: Min(1, Max(98 - var(--cb), 0)); /* порог 2% */

        display: inline-block;
        height: Max(var(--track-height), var(--thumb-size));
        background: linear-gradient(
            to right,
            var(--ticks-color) var(--ticks-thickness),
            transparent 1px
          )
          repeat-x;
        background-size: var(--tickIntervalPerc) var(--ticks-height);
        background-position-x: calc(
          var(--thumb-size) / 2 - var(--ticks-thickness) / 2
        );
        background-position-y: var(--flip-y, bottom);

        padding-bottom: var(--flip-y, var(--ticks-gap));
        padding-top: calc(var(--flip-y) * var(--ticks-gap));

        position: relative;
        z-index: 1;
      }

      .range-slider[data-ticks-position="top"] {
        --flip-y: 1;
      }

      /* подписи min/max по краям слайдера */
      .range-slider::before,
      .range-slider::after {
        --offset: calc(var(--thumb-size) / 2);
        content: counter(x);
        display: var(--show-min-max, block);
        font: var(--min-max-font);
        position: absolute;
        bottom: var(--flip-y, -2.5ch);
        top: calc(-2.5ch * var(--flip-y));
        opacity: Clamp(0, var(--at-edge), var(--min-max-opacity));
        transform: translateX(
            calc(var(--min-max-x-offset) * var(--before, -1) * -1)
          )
          scale(var(--at-edge));
        pointer-events: none;
      }

      .range-slider::before {
        --before: 1;
        --at-edge: var(--thumb-close-to-min);
        counter-reset: x var(--min);
        left: var(--offset);
      }

      .range-slider::after {
        --at-edge: var(--thumb-close-to-max);
        counter-reset: x var(--max);
        right: var(--offset);
      }

      .range-slider__values {
        position: relative;
        top: 50%;
        line-height: 0;
        text-align: justify;
        width: 100%;
        pointer-events: none;
        margin: 0 auto;
        z-index: 5;
      }

      /* хитрость, чтобы сработал text-align: justify */
      .range-slider__values::after {
        content: "";
        width: 100%;
        display: inline-block;
        height: 0;
        background: red;
      }

      .range-slider__progress {
        --start-end: calc(var(--thumb-size) / 2);
        --clip-end: calc(100% - (var(--cb)) * 1%);
        --clip-start: calc(var(--ca) * 1%);
        --clip: inset(-20px var(--clip-end) -20px var(--clip-start));
        position: absolute;
        left: var(--start-end);
        right: var(--start-end);
        top: calc(
          var(--ticks-gap) * var(--flip-y, 0) + var(--thumb-size) / 2 -
            var(--track-height) / 2
        );
        height: calc(var(--track-height));
        background: var(--progress-background, #eee);
        pointer-events: none;
        z-index: -1;
        border-radius: var(--progress-radius);
      }

      /* заливка — выделенная часть полосы */
      .range-slider__progress::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        clip-path: var(--clip);
        top: 0;
        bottom: 0;
        background: var(--fill-color, black);
        box-shadow: var(--progress-flll-shadow);
        z-index: 1;
        border-radius: inherit;
      }

      /* эффект тени поверх полосы */
      .range-slider__progress::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        box-shadow: var(--progress-shadow);
        pointer-events: none;
        border-radius: inherit;
      }

      .range-slider > input {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: var(--thumb-size);
        margin: 0;
        position: absolute;
        left: 0;
        top: calc(
          50% - Max(var(--track-height), var(--thumb-size)) / 2 +
            calc(var(--ticks-gap) / 2 * var(--flip-y, -1))
        );
        cursor: -webkit-grab;
        cursor: grab;
        outline: none;
        background: none;
      }

      .range-slider > input:not(:only-of-type) {
        pointer-events: none;
      }

      /* Стили бегунка — каждое правило вынесено отдельно: неизвестный
         вендорный псевдоэлемент в списке селекторов делает всё
         правило невалидным */
      .range-slider > input::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        height: var(--thumb-size);
        width: var(--thumb-size);
        transform: var(--thumb-transform);
        border-radius: var(--thumb-radius, 50%);
        background: var(--thumb-color);
        box-shadow: var(--thumb-shadow);
        border: none;
        pointer-events: auto;
        transition: 0.1s;
      }

      .range-slider > input::-moz-range-thumb {
        appearance: none;
        height: var(--thumb-size);
        width: var(--thumb-size);
        transform: var(--thumb-transform);
        border-radius: var(--thumb-radius, 50%);
        background: var(--thumb-color);
        box-shadow: var(--thumb-shadow);
        border: none;
        pointer-events: auto;
        transition: 0.1s;
      }

      .range-slider > input::-ms-thumb {
        appearance: none;
        height: var(--thumb-size);
        width: var(--thumb-size);
        transform: var(--thumb-transform);
        border-radius: var(--thumb-radius, 50%);
        background: var(--thumb-color);
        box-shadow: var(--thumb-shadow);
        border: none;
        pointer-events: auto;
        transition: 0.1s;
      }

      .range-slider > input:hover {
        --thumb-shadow: var(--thumb-shadow-hover);
      }

      .range-slider > input:hover + output {
        --value-background: var(--value-background-hover);
        --y-offset: -5px;
        color: var(--value-active-color);
        box-shadow: 0 0 0 3px var(--value-background);
      }

      .range-slider > input:active {
        --thumb-shadow: var(--thumb-shadow-active);
        cursor: grabbing;
        /* при пересечении бегунков перемещаемый — всегда сверху */
        z-index: 2;
      }

      .range-slider > input:active + output {
        transition: 0s;
      }

      .range-slider > input:nth-of-type(1) {
        --is-left-most: Clamp(0, (var(--value-a) - var(--value-b)) * 99999, 1);
      }

      .range-slider > input:nth-of-type(1) + output {
        --value: var(--value-a);
        --x-offset: calc(var(--completed-a) * -1%);
      }

      .range-slider > input:nth-of-type(1) + output:not(:only-of-type) {
        --flip: calc(var(--thumbs-too-close) * -1);
      }

      .range-slider > input:nth-of-type(1) + output::after {
        content: var(--prefix, "") var(--text-value-a) var(--suffix, "");
      }

      .range-slider > input:nth-of-type(2) {
        --is-left-most: Clamp(0, (var(--value-b) - var(--value-a)) * 99999, 1);
      }

      .range-slider > input:nth-of-type(2) + output {
        --value: var(--value-b);
      }

      /* у одиночного слайдера начало полосы не обрезается */
      .range-slider > input:only-of-type ~ .range-slider__progress {
        --clip-start: 0;
      }

      .range-slider > input + output {
        --flip: -1;
        --x-offset: calc(var(--completed-b) * -1%);
        --pos: calc(
          ((var(--value) - var(--min)) / (var(--max) - var(--min))) * 100%
        );

        pointer-events: none;
        position: absolute;
        z-index: 5;
        background: var(--value-background);
        border-radius: 10px;
        padding: 2px 4px;
        left: var(--pos);
        transform: translate(
          var(--x-offset),
          calc(
            150% * var(--flip) -
              (var(--y-offset, 0px) + var(--value-offset-y)) * var(--flip)
          )
        );
        transition:
          all 0.12s ease-out,
          left 0s;
      }

      .range-slider > input + output::after {
        content: var(--prefix, "") var(--text-value-b) var(--suffix, "");
        font: var(--value-font);
      }

      /* //////////////////////////////////////////////
         2. Тема "overlay" — оформление слайдера для квиза
         (крупный бегунок поверх полосы с цифрами)
         ////////////////////////////////////////////// */
      .range-slider.overlay {
        --primary-color: #dbeafe;
        --track-height: 64px;
        --thumb-size: var(--track-height);
        --thumb-color: var(--primary-color);
        --thumb-shadow: none;
        --progress-flll-shadow: none;
        --progress-shadow: none;
        --progress-background: none;
        --progress-radius: 0px;
        --ticks-color: var(--primary-color);
        --ticks-height: 0;
        --ticks-thickness: 0;
        --ticks-gap: 0px; /* единицы измерения обязательны */
        --min-max-font: 700 18px Arial;
        --min-max-opacity: 1;
        --show-min-max: none;

        color: #4c9afd;
      }

      /* Ховер-эффект бегунка — "полумесяц" на его краю.
         "--thumb-shadow-hover" здесь не подходит: нужна переменная
         "--is-left-most", объявляемая на каждом инпуте (0 или 1);
         отрицательный сдвиг рисует полумесяц у правого края бегунка */
      .range-slider.overlay input:hover {
        --thumb-shadow: calc(var(--thumb-size) * (var(--is-left-most) - 0.5)) 0
          0 calc(var(--thumb-size) * -0.3) #4c9afd inset;
      }

      .range-slider.overlay input:active {
        --thumb-color: inherit;
      }

      /* Режим одиночного выбора (количество): круглая шапка слева —
         кружок с цифрой "1" на левом конце полосы. Вынесена в отдельный
         элемент, чтобы проценты обрезки заливки продолжали считаться
         от исходного блока прогресса: край заливки остаётся скрыт
         под кружком, и полоса выглядит цельной до выбранной цифры */
      .range-slider.overlay .range-slider__cap {
        pointer-events: none;
        position: absolute;
        left: 0;
        top: calc(var(--thumb-size) / 2 - var(--track-height) / 2);
        width: var(--thumb-size);
        height: var(--thumb-size);
        border-radius: 50%;
        background: var(--fill-color);
        z-index: -1;
      }

      .range-slider.overlay .range-slider__values {
        /* контейнер растянут ровно между центрами крайних бегунков */
        width: calc(100% - var(--thumb-size));
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          "Segoe UI",
          Arial,
          sans-serif;
        font-size: 20px;
        font-weight: 600;
      }

      /* Центрируем крайние цифры в их кружках: "1" — в круглой шапке
         слева, "10" — под правым бегунком (justify прижимает оба спана
         к краям контейнера, а сдвиги компенсируют ширину символов) */
      .range-slider.overlay .range-slider__values span:first-child {
        position: relative;
        left: -0.22em;
      }

      .range-slider.overlay .range-slider__values span:last-child {
        position: relative;
        left: 0.55em;
      }

      /* цифры вне выбранного диапазона — чуть бледнее */
      .range-slider.overlay .range-slider__values span {
        transition: color 0.15s;
      }

      .range-slider.overlay .range-slider__values span:not(.is-active) {
        color: #6bb1f3;
      }

      /* //////////////////////////////////////////////
         3. Страница и карточка квиза
         ////////////////////////////////////////////// */
      body {
        margin: 0;
        min-height: 100vh;
        box-sizing: border-box;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f6fb;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          "Segoe UI",
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .quiz-card {
        width: 100%;
        max-width: 1296px;
        min-height: 750px;
        display: flex;
        flex-direction: column;
        background: #fff;
        border-radius: 32px;
        box-shadow: 0 24px 64px rgba(23, 58, 110, 0.08);
      }

      .quiz-card__body {
        flex: 1;
        padding: 40px 40px 32px 40px;
      }

      /* --- прогресс-бар шага квиза --- */
      .quiz-progress__label {
        margin-bottom: 10px;
        font-size: 16px;
        font-weight: 500;
        color: #8a94a6;
      }

      .progress-container {
        position: relative;
        display: flex;
        justify-content: flex-start;
        align-items: center;
        width: 100%;
      }

      .progress-container::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 10px;
        background-color: #f5f5f5;
        border-radius: 100px;
      }

      .progress-bar {
        position: relative;
        overflow: hidden;
        transform: translateZ(0);
        display: grid;
        place-items: center;
        height: 10px;
        width: 800px;
        border: 0;
        border-radius: 100px;
        transition: width 0.3s ease;
      }

      @keyframes loading {
        0% {
          transform: translateX(25px);
        }
        100% {
          transform: translateX(70px);
        }
      }

      .progress-bar::before {
        content: "";
        position: absolute;
        z-index: 1;
        top: 0;
        left: -400%;
        width: 700%;
        height: 100%;
        background: #4ade80
          repeating-linear-gradient(
            60deg,
            transparent,
            transparent 10px,
            #36d26f 10px,
            #36d26f 20px
          );

        animation: loading 2s infinite linear;
      }

      /* --- заголовок вопроса --- */
      .quiz-title {
        margin: 26px 0 30px;
        font-size: 36px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #252b37;
      }

      /* --- инпут количества специалистов (над слайдером) --- */
      .specialists-input {
        width: 120px;
        height: 64px;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 20px;
        font-weight: 500;
        color: #252b37;
        text-align: center;
        border: 1.5px solid #dbe4f0;
        border-radius: 16px;
        outline: none;
        margin-bottom: 24px;
        transition: border-color 0.15s;
      }

      .specialists-input:focus {
        border-color: #4c9afd;
      }

      /* скрыть стрелки up/down у number-инпута */
      .specialists-input::-webkit-outer-spin-button,
      .specialists-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        appearance: none;
        margin: 0;
      }

      .specialists-input[type="number"] {
        -moz-appearance: textfield;
        appearance: textfield;
      }

      /* слайдер на всю ширину карточки */
      .quiz-card .range-slider {
        width: 100%;
        min-width: 0;
      }

      /* --- кнопки футера --- */
      .quiz-card__footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 28px;
        border-top: 1px solid #eef1f6;
      }

      .quiz-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 13px 22px;
        border-radius: 999px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s,
          box-shadow 0.15s;
      }

      .quiz-btn--ghost {
        background: #fff;
        border: 1.5px solid #dbe4f0;
        color: #4c9afd;
      }

      .quiz-btn--ghost:hover {
        border-color: #b9d4fd;
        background: #f5f9ff;
      }

      .quiz-btn--primary {
        padding: 14px 26px;
        background: #4c9afd;
        border: none;
        color: #fff;
        box-shadow: 0 10px 22px rgba(76, 154, 253, 0.35);
      }

      .quiz-btn--primary:hover {
        background: #3a8df9;
      }

      /* --- 4. адаптивность --- */
      @media screen and (max-width: 640px) {
        body {
          padding: 12px;
        }

        .quiz-card {
          min-height: 480px;
        }

        .quiz-card__body {
          padding: 20px 20px 32px;
        }

        .quiz-title {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="quiz-card">
      <div class="quiz-card__body">
        <!-- Прогресс-бар: шаг 4 из 6 -->
        <div class="quiz-progress">
          <div class="quiz-progress__label">Шаг 4 из 6</div>
          <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
          </div>
        </div>

        <!-- Вопрос -->
        <h1 class="quiz-title">Сколько специалистов нужно?</h1>

        <!-- Инпут количества (синхронизирован со слайдером) -->
        <input
          type="number"
          class="specialists-input"
          id="specialistsInput"
          min="1"
          max="10"
          step="1"
          value="1"
          aria-label="Количество специалистов"
        />

        <!-- Слайдер одиночного выбора: количество (1..10).
             Диапазон и стартовое значение задаются CSS-переменными
             в атрибуте style: --min, --max, --step, --value -->
        <div
          class="range-slider overlay"
          style="
            --min: 1;
            --max: 10;
            --step: 1;
            --value: 1;
            --text-value: &quot;1&quot;;
          "
        >
          <input
            type="range"
            id="specialistsRange"
            min="1"
            max="10"
            step="1"
            value="1"
            aria-label="Количество специалистов"
          />
          <div class="range-slider__values">
            <span data-value="1">1</span> <span data-value="2">2</span>
            <span data-value="3">3</span> <span data-value="4">4</span>
            <span data-value="5">5</span> <span data-value="6">6</span>
            <span data-value="7">7</span> <span data-value="8">8</span>
            <span data-value="9">9</span> <span data-value="10">10</span>
          </div>
          <div class="range-slider__progress"></div>
          <div class="range-slider__cap"></div>
        </div>
      </div>

      <!-- Футер с кнопками -->
      <div class="quiz-card__footer">
        <button type="button" class="quiz-btn quiz-btn--ghost">← Назад</button>
        <button type="button" class="quiz-btn quiz-btn--primary">
          Далее →
        </button>
      </div>
    </div>

    <script>
      // Двусторонняя синхронизация: инпут количества <-> слайдер.
      // Источник истины — сам range-инпут (rangeInput).
      // CSS-переменные "--value" и "--text-value" на контейнере слайдера
      // управляют визуальным состоянием: заливкой полосы и цифрой на бегунке.

      const MIN = 1; // допустимый диапазон значений
      const MAX = 10;

      const numberInput = document.getElementById("specialistsInput");
      const rangeInput = document.getElementById("specialistsRange");
      const slider = rangeInput.closest(".range-slider");

      // Устанавливает значение слайдера: обновляет range-инпут
      // и CSS-переменные, отвечающие за визуальное состояние
      function setSliderValue(value) {
        rangeInput.value = value;
        slider.style.setProperty("--value", value);
        slider.style.setProperty("--text-value", JSON.stringify(String(value)));
        updateValuesHighlight(Number(value));
      }

      // Подсвечивает цифры в выбранном диапазоне (1..value):
      // остальные цифры бледнеют (класс "is-active" снимается)
      function updateValuesHighlight(value) {
        slider
          .querySelectorAll(".range-slider__values span")
          .forEach((span) => {
            span.classList.toggle(
              "is-active",
              Number(span.dataset.value) <= value,
            );
          });
      }

      // Слайдер -> инпут: при движении бегунка меняем число в инпуте
      rangeInput.addEventListener("input", () => {
        setSliderValue(rangeInput.value);
        numberInput.value = rangeInput.value;
      });

      // Инпут -> слайдер: при вводе числа двигаем бегунок.
      // Выход за диапазон (1..10) ограничиваем,
      // пустое и нечисловое значение игнорируем
      numberInput.addEventListener("input", () => {
        if (numberInput.value === "") return;

        const value = Number(numberInput.value);
        if (Number.isNaN(value)) return;

        setSliderValue(Math.min(MAX, Math.max(MIN, value)));
      });

      // При потере фокуса приводим значение инпута
      // к последнему валидному значению слайдера
      numberInput.addEventListener("blur", () => {
        numberInput.value = rangeInput.value;
      });

      // Начальная подсветка цифр под стартовое значение
      updateValuesHighlight(Number(rangeInput.value));
    </script>
  </body>
</html>
