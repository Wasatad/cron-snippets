<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Контакты — карта и контактная карточка</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        color: #202044;
      }

      .contacts-section {
        width: 100%;
      }

      .contacts-map {
        position: relative;
        width: 100%;
        height: 625px;
        overflow: hidden;
        background: #f1f1f1;
      }

      /* Карта занимает всю площадь секции */
      #map {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* Карточка контактов поверх карты */
      .contacts-card {
        position: absolute;
        z-index: 10;
        top: 50%;
        right: max(calc((100% - 1278px) / 2), 40px);
        transform: translateY(-50%);
        width: 450px;
        padding: 38px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 35px rgba(0, 0, 0, 0.08);
      }

      .contacts-card h2 {
        margin: 0 0 24px;
        font-size: 28px;
        line-height: 1.2;
        font-weight: 700;
        color: #202044;
      }

      .contact-item {
        margin-bottom: 16px;
      }

      .contact-item:last-child {
        margin-bottom: 0;
      }

      .contact-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        font-size: 16px;
        line-height: 1.4;
        font-weight: 700;
      }

      .contact-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 17px;
        flex: 0 0 17px;
        font-size: 17px;
      }

      .contact-item p {
        margin: 0 0 0 25px;
        font-size: 13px;
        line-height: 1.55;
        font-weight: 400;
      }

      .contact-item a {
        color: inherit;
        text-decoration: none;
      }

      .contact-item a:hover {
        text-decoration: underline;
      }

      .contact-item .email-link {
        color: #8b6cff;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      /* Планшеты и мобильные устройства */
      @media (max-width: 768px) {
        .contacts-map {
          height: auto;
          display: flex;
          flex-direction: column;
          overflow: visible;
        }

        #map {
          position: relative;
          inset: auto;
          height: 400px;
          flex: 0 0 400px;
        }

        .contacts-card {
          position: relative;
          top: auto;
          right: auto;
          transform: none;
          width: calc(100% - 32px);
          max-width: 520px;
          margin: -40px auto 24px;
          padding: 28px 24px;
        }

        .contacts-card h2 {
          font-size: 24px;
        }
      }

      @media (max-width: 420px) {
        #map {
          height: 340px;
          flex-basis: 340px;
        }

        .contacts-card {
          padding: 24px 20px;
        }

        .contact-item p {
          font-size: 12px;
        }
      }
    </style>

    <!-- Вставьте свой API-ключ вместо YOUR_API_KEY -->
    <script
      src="https://api-maps.yandex.ru/2.1/?apikey=79916b53-048c-4290-a160-c108e0c72de1&lang=ru_RU"
      type="text/javascript"
    ></script>
  </head>

  <body>
    <section class="contacts-section">
      <div class="contacts-map">
        <div id="map" aria-label="Карта расположения офиса"></div>

        <div class="contacts-card">
          <h2>Контакты</h2>

          <div class="contact-item">
            <div class="contact-title">
              <span class="contact-icon" aria-hidden="true">⌖</span>
              Адрес:
            </div>
            <p>
              127434, город Москва, Дмитровское ш., д. 9, этаж 4, помещ.
              ШИБ/ком. 5
            </p>
          </div>

          <div class="contact-item">
            <div class="contact-title">
              <span class="contact-icon" aria-hidden="true">◷</span>
              Режим работы:
            </div>
            <p>Пн. – Пт.: с 9:00 до 18:00</p>
          </div>

          <div class="contact-item">
            <div class="contact-title">
              <span class="contact-icon" aria-hidden="true">☎</span>
              Телефоны:
            </div>
            <p>
              <a href="tel:88003019515">8 800 301-95-15</a>
              (контактный телефон)<br />
              <a href="tel:84993017000">8 499 301-70-00</a>
              (бухгалтерия)
            </p>
          </div>

          <div class="contact-item">
            <div class="contact-title">
              <span class="contact-icon" aria-hidden="true">✉</span>
              E-mail:
            </div>
            <p>
              <a class="email-link" href="mailto:info@1c-tc.ru">
                info@1c-tc.ru
              </a>
            </p>
          </div>
        </div>
      </div>
    </section>

    <script>
      // Координаты офиса
      const officeCoordinates = [55.815337, 37.575549];

      if (window.ymaps) {
        ymaps.ready(function () {
          const map = new ymaps.Map("map", {
            center: officeCoordinates,
            zoom: 16,
            controls: ["zoomControl"],
          });

          // Отключаем масштабирование колесиком мыши
          map.behaviors.disable("scrollZoom");

          const placemark = new ymaps.Placemark(
            officeCoordinates,
            {
              hintContent: "Наш офис",
              balloonContent: "Контактная информация",
            },
            {
              preset: "islands#violetCircleDotIcon",
            },
          );

          map.geoObjects.add(placemark);
        });
      } else {
        console.error(
          "Не удалось загрузить Яндекс Карты. Проверьте API-ключ и подключение к интернету.",
        );
      }
    </script>
  </body>
</html>
