<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Блок подбора специалистов</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Подключение шрифта Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page-wrapper">
      <div class="quiz-cover-card">
        <h2 class="quiz-title">
          Подберем специалистов<br /><span>под ваши задачи</span>
        </h2>

        <p class="quiz-description">
          Ответьте на несколько простых вопросов и мы вышлем вам подборку
          резюме<br />
          специалистов, подходящих под ваш проект
        </p>
        <button class="quiz-button">
          Подобрать специалистов <span class="arrow">&rarr;</span>
        </button>
      </div>
    </div>
  </body>
</html>

<style>
  /* Базовые настройки страницы */
  body,
  html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: "Inter", sans-serif;
    background-color: #f5f7fa; /* Светло-серый фон страницы (снаружи блока) */
  }

  /* Контейнер для центрирования карточки на весь экран */
  .page-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
  }

  /* Внутренний блок (карточка) */
  .quiz-cover-card {
    width: 1296px;
    height: 750px;
    background-color: #ffffff;
    border-radius: 24px;
    box-shadow: 0px 32px 64px -12px rgba(76, 154, 253, 0.15);

    /* Flexbox для центрирования контента внутри */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;

    /* МЕСТО ДЛЯ ВАШЕЙ КАРТИНКИ */
    /* Раскомментируйте код ниже и укажите путь к изображению, когда оно будет готово */

    background-image: url("src/quiz-bg.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* Заголовок */
  .quiz-title {
    font-size: 48px;
    font-weight: 500;
    color: #212529;
    margin: 0 0 20px 0;
  }

  .quiz-title span {
    color: #4c9afd;
  }

  /* Описание */
  .quiz-description {
    font-size: 20px;
    font-weight: 300;
    color: #6c757d;
    line-height: 1.5;
    margin: 0 0 40px 0;
    max-width: 800px;
  }

  /* Кнопка */
  .quiz-button {
    position: relative;
    overflow: hidden;
    background-color: #4c9afd;
    color: #ffffff;
    font-family: "Inter", sans-serif;
    font-size: 18px;
    font-weight: 500;
    border: none;
    border-radius: 50px;
    padding: 16px 40px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.2s ease;
  }

  /* Скошенная полоса для эффекта "flash" */
  .quiz-button::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 60px;
    height: 100%;
    background: linear-gradient(
      120deg,
      transparent,
      rgba(255, 255, 255, 0.35),
      transparent
    );
    transform: skewX(-20deg) translateX(-150%);
    animation: flash 3s ease-in-out infinite;
  }

  @keyframes flash {
    0%,
    60% {
      transform: skewX(-20deg) translateX(-150%);
    }
    100% {
      transform: skewX(-20deg) translateX(400%);
    }
  }

  .quiz-button:hover {
    background-color: #357abd;
  }

  .quiz-button .arrow {
    margin-left: 8px;
    font-size: 20px;
    line-height: 1;
  }
</style>
